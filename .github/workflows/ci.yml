name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependências
        run: dotnet restore CodeQuest.slnx

      - name: Build
        run: dotnet build CodeQuest.slnx --no-restore --configuration Release

      - name: Testes unitários (CodeQuest.Tests)
        run: dotnet test CodeQuest.Tests --no-build --configuration Release --logger "console;verbosity=normal"

      # O runner do GitHub já vem com Docker rodando — o Testcontainers sobe o Postgres sozinho.
      - name: Testes de integração (CodeQuest.IntegrationTests)
        run: dotnet test CodeQuest.IntegrationTests --no-build --configuration Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes (Vitest)
        run: npm test

      - name: Build de produção
        run: npm run build
